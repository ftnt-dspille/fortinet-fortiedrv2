name: tests

# The connector runtime is the FortiSOAR 8.0 appliance (Python 3.11); 3.12
# covers the next interpreter up. Python 3.9 / FortiSOAR 7.6 is not supported.
on:
  push:
    branches: ['*']
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - run: pip install -r requirements.txt -r tests/requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Offline tests
        run: pytest tests/ -q
