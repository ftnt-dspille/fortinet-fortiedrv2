name: tests

# The connector runtime is the FortiSOAR appliance: Python 3.9 on 7.6.x is the
# floor, 3.12 stands in for the 8.0 runtime. Anything that fails on 3.9 fails
# on the appliances customers actually run.
on:
  push:
    branches: ['*']
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - run: pip install -r requirements.txt -r tests/requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Offline tests
        run: pytest tests/ -q
